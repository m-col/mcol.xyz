name: build

on:
  pull_request:

jobs:
  build:
    # Pinned: gitja's prebuilt binary links against libicuuc.so.74, which
    # ubuntu-latest (now 26.04) no longer ships.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/build-site
